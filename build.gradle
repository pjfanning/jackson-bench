plugins {
    id 'java'
    id "me.champeau.jmh" version "0.7.3"
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-core:2.22.2'
    implementation 'tools.jackson.core:jackson-core:3.2.2'
    implementation 'tools.jackson.core:jackson-databind:3.2.2'
    implementation 'tools.jackson.dataformat:jackson-dataformat-smile:3.2.2'
    implementation 'tools.jackson.dataformat:jackson-dataformat-cbor:3.2.2'
    implementation 'tools.jackson.dataformat:jackson-dataformat-protobuf:3.2.2'
    implementation 'tools.jackson.dataformat:jackson-dataformat-avro:3.2.2'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jmhJar {
    manifest {
        attributes 'Multi-Release': 'true'
    }
}

// see https://github.com/melix/jmh-gradle-plugin?tab=readme-ov-file#configuration-options
jmh {
    // NOTE: the plugin joins this list with ',' into a SINGLE JMH filter argument, so a
    // multi-element list matches nothing -- keep it to one regex, alternating if needed.
    includes = ['.*(Smile).*']
    //includes = ['.*(CBOR|Smile|Protobuf|Avro).*']
}